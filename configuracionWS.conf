WS_TRABAJO="$HOME/$WS_NAME"
DIRECTORIO_CODIGO_FUENTE="$WS_TRABAJO/src"
ARCHIVO_CONFIGURACION="$WS_TRABAJO/install/setup.bash"
ARCHIVO_BASHRC="$HOME/.bashrc"

# Flags de entorno
ENTORNO="Desarrollo_Robotica"

# Ruta de configuración de Kitty Terminal
KITTY_CONF="$HOME/.config/kitty/kitty.conf"