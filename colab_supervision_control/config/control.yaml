control_supervisor:
  ros__parameters:

    # Entrada proveniente del nodo de interacción espacial ya procesado
    interaction_topic: "/robot_operator_interaction"

    # Salida preprocesada para control_decision
    supervision_topic: "/control/robot_operator_state"

    # Ventana temporal para detectar persistencia de WARNING
    warning_history_size: 5

    # Número de muestras consecutivas DANGEROUS/CRITICAL para marcar
    # una condición persistente. Este indicador es informativo para
    # control_decision y no reemplaza el riesgo crítico actual.
    danger_persistent_frames: 5

    # Tiempo máximo para conservar la última distancia válida
    distance_memory_timeout: 1.0
