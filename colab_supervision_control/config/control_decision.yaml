control_decision:
  ros__parameters:

    # ========================================================================
    # INPUTS
    # ========================================================================

    operator_state_topic: "/operator/state_analisis"
    supervision_topic: "/control/robot_operator_state"
    trajectory_topic: "/control/trajectory"
    command_topic: "/control/command"

    socket_ready_topic: "/SockRes/Ready"
    tcp_euler_topic: "/SockRes/TCPeul"
    tcp_quaternion_topic: "/SockRes/TCPcua"
    robot_joints_topic: "/SockRes/Joints"

    commander_euler_topic: "/pose_command"
    commander_quaternion_topic: "/posecua_command"
    commander_joint_topic: "/joint_command"
    name_command_topic: "name_command"

    # ========================================================================
    # DECISION LOOP
    # ========================================================================

    decision_rate_hz: 10.0
    max_input_age_sec: 0.50
    max_trajectory_age_sec: 2.0
    max_robot_joints_age_sec: 5.0
    max_tcp_state_age_sec: 5.0

    # ========================================================================
    # OPERATING ZONES
    #
    # Z3  : d <  0.250 m
    # Z4  : 0.250 m <= d < 0.400 m
    # Z5  : 0.400 m <= d <= 1.600 m
    # Z6  : d >  1.600 m
    # ========================================================================

    zone3_max_distance: 0.250
    zone4_max_distance: 0.400
    zone5_max_distance: 1.600

    # ========================================================================
    # SPEED PROFILE
    # ========================================================================

    full_speed_distance: 1.900
    half_speed_distance: 1.600
    minimum_speed_distance: 0.400

    full_speed_percent: 100.0
    half_speed_percent: 50.0
    minimum_speed_percent: 5.0
    speed_change_threshold_percent: 3.0

    # Additional multiplier applied after the distance-based speed profile.
    # LOW fatigue -> 100% of profile.
    # MEDIUM fatigue -> 70% of profile (30% additional reduction).
    # HIGH fatigue -> controlled pause, therefore no speed is applied.
    fatigue_medium_speed_factor: 0.70

    # ========================================================================
    # OPERATOR CONDITIONS
    # ========================================================================

    pause_on_fatigue_high: true
    pause_on_attention_other: true
    pause_on_attention_unknown: true

    # ========================================================================
    # TRAJECTORY SAFETY
    # ========================================================================

    conservative_trajectory_check: true
    trajectory_min_separation_distance: 0.400

    # Raw ABB joint feedback is often in degrees; set false if the bridge
    # already converts /SockRes/Joints to radians.
    sock_joints_in_degrees: true
    # Mean joint error normalized by a 2*pi rad full revolution per joint.
    # Below 5% -> do not send another motion for an essentially identical endpoint.
    joint_similarity_tolerance_percent: 5.0

    # ========================================================================
    # COMMAND GRAMMAR
    # ========================================================================
    #
    # The node uses only the command structures understood by the parser:
    #
    # Variable / SET / Sock_Parada   / TRUE
    # Variable / SET / Sock_Pausa    / TRUE
    # Variable / SET / Sock_Bloquear / TRUE
    # Variable / SET / Sock_Reinicio / TRUE
    # Velocidad / Porcentaje / VelMax / <0-100>
    # Velocidad / Max        / VelMax / <0-100>
    # Distancia / GetPostura / Prototipo / TCPEuler
    # Distancia / GetPostura / Prototipo / TCPTCPCua
    # Distancia / CambiarTrayectoria / ActualizarPuntos / Interes
    # Distancia / CambiarTrayectoria / SetOffsets / [x,y,z]
    # Distancia / CambiarTrayectoria / ActualizarPuntos / GuardarPSalida
    # Distancia / CambiarTrayectoria / MoveTemp / MoveJoint
    # Distancia / CambiarTrayectoria / MoveTemp / MoveLinear
    # Distancia / Postura_segura / robtargetJ / Nombre_punto
    # Distancia / Postura_segura / robtargetL / Nombre_punto
    # Distancia / Postura_segura / JoinConf / [[articulaciones],[9E9,...]]
    #
    # ========================================================================

    send_trajectory_interest_command: true
    send_restart_before_motion: true
    send_speed_command_before_motion: true

    # Blocks new actions only if enabled by the application logic.
    block_during_distance_correction: false

    # User can choose MoveJoint or MoveLinear for the temporary offset move.
    distance_move_type: "MoveLinear"

    # Select only one representation to send to Commander (avoid duplicate moves).
    # Options: quaternion, euler, joints. Quaternion uses the cached /SockRes/TCPcua;
    # euler uses /SockRes/TCPeul; joints sends the accepted MoveIt endpoint.
    commander_pose_mode: "quaternion"
    commander_cartesian_path: false

    # Conversion from the socket TCP position units to MoveIt meters.
    # 0.001 means /SockRes/TCP* comes in millimeters. Set 1.0 if already meters.
    tcp_position_scale_to_commander: 0.001
    # True when TCP Euler angles from the parser arrive in degrees; Commander
    # expects radians. Has no effect in quaternion mode.
    tcp_euler_angles_in_degrees: true

    # Socket queue is hard-limited to 20 commands and 60 seconds maximum lifetime.
    command_queue_capacity: 20
    command_queue_ttl_sec: 60.0

    # Legacy configurable offset used by the generic INCREASE_DISTANCE action.
    # The explicit trajectory-change protocols use the fixed offsets defined
    # below and do not depend on this parameter.
    set_offsets_value: ""

    # ========================================================================
    # EXPLICIT TRAJECTORY CHANGE PROTOCOL
    # ========================================================================
    #
    # Exit protocol:
    #   Sock_Bloquear
    #   GuardarPSalida
    #   Interes
    #   GetPostura/TCPTCPCua
    #
    #   Z_salida > 0.402 m:
    #     SetOffsets [0,0,-20] -> MoveLinear
    #
    #   Z_salida <= 0.402 m:
    #     SetOffsets [0,0,-20] -> MoveLinear
    #     SetOffsets [10,0,-20] -> MoveJoint
    #     GetPostura/TCPTCPCua
    #     publish PosSeguraYPos or PosSeguraYNeg to name_command
    #     Commander trajectory rad -> deg -> JoinConf
    #
    # Recovery protocol when Zone 5 is recovered:
    #   GetPostura/TCPTCPCua
    #
    #   Z_salida > 0.402 m:
    #     SetOffsets [0,0,-20] -> MoveLinear
    #
    #   Z_salida <= 0.402 m:
    #     SetOffsets [10,0,-20] -> MoveJoint
    #     SetOffsets [0,0,-20] -> MoveLinear
    #
    #   robtargetL/p_salida_guardado
    #   SetOffsets [0,0,0]
    #   Variable/SET/Sock_Reinicio/TRUE
    #
    # JoinConf always receives ABB joint angles in degrees.
    # ========================================================================

    # Kept for compatibility with the generic command builders.
    safe_posture_joint_point: ""
    safe_posture_linear_point: ""
